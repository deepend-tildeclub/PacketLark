name: Build PacketLark

on:
  push:
    branches: ['**']
    tags: ['v*-beta.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Linux desktop and package dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libsecret-1-0
      - name: Install locked dependencies
        run: npm ci
      - name: Audit application dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Report upstream build-tool audit findings
        continue-on-error: true
        run: npm audit --audit-level=moderate
      - name: Check types, lint, formatting, and protocol/mailbox tests
        run: npm run check
      - name: Test Synchronet provisioning
        run: python -m unittest discover -s tools -p "test_*.py" -v
      - name: Build application
        run: npm run build
      - name: Test Linux desktop and message interface
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- node tools/smoke-keyring.mjs
          xvfb-run -a npm run test:desktop
          xvfb-run -a npm run test:ui -- --workers=1
      - name: Test Windows desktop and message interface
        if: runner.os == 'Windows'
        run: |
          npm run test:desktop
          npm run test:ui -- --workers=1
      - name: Create installers and portable packages
        run: npm run dist
      - name: Upload Windows packages
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PacketLark-Windows-x64
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PacketLark-Linux-x64
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostic test artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Test-diagnostics-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  node-26:
    name: Check Node 26 and npm 12
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Use npm 12
        run: npm install --global npm@12.2.0
      - name: Install locked dependencies with explicit script policy
        run: npm ci
      - name: Check types, lint, formatting, and protocol/mailbox tests
        run: npm run check
      - name: Audit application dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Report upstream build-tool audit findings
        continue-on-error: true
        run: npm audit --audit-level=moderate
      - name: Build application
        run: npm run build

  publish-preview:
    name: Publish tagged preview
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, node-26]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: PacketLark-*-x64
          path: preview-assets
          merge-multiple: true
      - name: Check tag and packages
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+-beta[.][0-9]+$ ]]
          [[ "$RELEASE_TAG" == "v$version" ]]
          cd preview-assets
          shopt -s nullglob
          exe=( *.exe ); zip=( *.zip ); appimage=( *.AppImage ); deb=( *.deb )
          [[ ${#exe[@]} == 1 && ${#zip[@]} == 1 && ${#appimage[@]} == 1 && ${#deb[@]} == 1 ]]
          sha256sum -- "${exe[@]}" "${zip[@]}" "${appimage[@]}" "${deb[@]}" > SHA256SUMS.txt
      - name: Publish on GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --prerelease \
            --title "PacketLark $RELEASE_TAG" --notes-file docs/PREVIEW-RELEASE.md \
            preview-assets/*.exe preview-assets/*.zip preview-assets/*.AppImage \
            preview-assets/*.deb preview-assets/SHA256SUMS.txt
